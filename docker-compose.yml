services:
  db:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: etm
      POSTGRES_PASSWORD: etmadm
      POSTGRES_DB: tasks_db
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etm -d tasks_db"]
      interval: 5s
      timeout: 5s
      retries: 5
 
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/code
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://etm:etmadm@db:5432/tasks_db
      DEBUG: "True"
      JWT_SECRET_KEY: change-me-please-in-a-real-env
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7
    depends_on:
      db:
        condition: service_healthy
 
volumes:
  postgres_data:
 